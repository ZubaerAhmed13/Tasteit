<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f3">
  <meta name="application-name" content="Tasteit">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Tasteit helps you explore recipes from around the world, save what you love and cook with ingredients you already have.">
  <title>Tasteit — Your world, your kitchen</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="./app.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./src/app.js"></script>
</head>
<body>
  <a href="#app" class="skip-link">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a href="./" class="brand" aria-label="Tasteit home"><span class="brand-mark" aria-hidden="true">✳</span>tasteit<span class="brand-dot">.</span></a>
      <nav class="site-nav" aria-label="Main navigation">
        <button type="button" data-nav="discover" class="nav-button active">Home</button>
        <button type="button" data-nav="library" class="nav-button">Saved</button>
        <button type="button" data-nav="pantry" class="nav-button">Kitchen</button>
        <button type="button" data-nav="plan" class="nav-button">Plan</button>
      </nav>
      <details class="more-tools"><summary>More tools</summary><div><a href="./selected-recipes.html">Publisher catalogue</a><button type="button" data-nav="world">Recipe research &amp; coverage</button></div></details>
    </div>
  </header>
  <main id="app" tabindex="-1"><div class="loading-screen"><div class="spinner"></div><p>Setting the table...</p></div></main>
  <div id="connection-status" class="connection-status" role="status" aria-live="polite" hidden></div>
  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-brand">tasteit<span>.</span></span>
      <span>Cook globally. Make it yours.</span>
      <span>Additional recipe data &amp; photography: <a href="https://www.themealdb.com/" target="_blank" rel="noopener noreferrer">TheMealDB</a> contributors. <a href="https://www.themealdb.com/terms_of_use.php" target="_blank" rel="noopener noreferrer">Source terms</a>.</span>
      <span>Private testing preview · Local by default · Cloud sync only when enabled</span>
    </div>
  </footer>
  <div id="overlay-root"></div>
  <div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
</body>
</html>
