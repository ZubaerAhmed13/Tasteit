name: Collect Tasteit source catalogue
on:
  workflow_dispatch:
  push:
    branches:
      - feat/recipe-kitchen-foundation
    paths:
      - scripts/collect-provider.mjs

permissions:
  contents: write

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect source-linked worldwide candidate index
        run: node scripts/collect-provider.mjs
      - name: Save source-only catalogue index on this development branch
        if: success() && github.ref == 'refs/heads/feat/recipe-kitchen-foundation'
        run: |
          mkdir -p data
          cp artifacts/world-catalogue-index.json data/world-catalogue-index.json
          cp artifacts/world-catalogue-coverage.csv data/world-catalogue-coverage.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world-catalogue-index.json data/world-catalogue-coverage.csv
          if git diff --cached --quiet; then
            echo "No candidate metadata changes"
          else
            git commit -m "data: add source-linked worldwide recipe candidate snapshot"
            git push origin HEAD:refs/heads/feat/recipe-kitchen-foundation
          fi
      - name: Upload reviewable metadata and coverage gaps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tasteit-country-category-coverage
          path: artifacts/world-catalogue-*.*
          retention-days: 30
          if-no-files-found: warn
