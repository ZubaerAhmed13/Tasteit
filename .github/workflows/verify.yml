name: Verify Tasteit
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Keep just the newest PR verification when several commits arrive in a row.
concurrency:
  group: tasteit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check syntax and unit tests
        run: npm run verify

  browser:
    name: Browser acceptance (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run headless browser acceptance
        env:
          TASTEIT_BROWSER: ${{ matrix.browser }}
        run: node tests/browser-smoke.mjs && node tests/discovery-browser.mjs && node tests/kitchen-browser.mjs
