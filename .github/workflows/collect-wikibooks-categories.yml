name: Wikibooks country and course research evidence
on:
  workflow_dispatch:
  push:
    branches:
      - feat/recipe-kitchen-foundation
    paths:
      - scripts/collect-wikibooks-categories.mjs
      - .github/workflows/collect-wikibooks-categories.yml
permissions:
  contents: write

jobs:
  category-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Retrieve Wikimedia article category labels
        run: node scripts/collect-wikibooks-categories.mjs
      - name: Save link-based category evidence to feature branch
        if: success() && github.ref == 'refs/heads/feat/recipe-kitchen-foundation'
        run: |
          cp artifacts/wikibooks-category-evidence.json data/wikibooks-category-evidence.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wikibooks-category-evidence.json
          if ! git diff --cached --quiet; then
            git commit -m "data: record Wikibooks source category labels for editorial research"
            git push origin HEAD:refs/heads/feat/recipe-kitchen-foundation
          fi
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tasteit-wikibooks-category-evidence
          path: artifacts/wikibooks-category-evidence.json
          retention-days: 30
          if-no-files-found: warn
