name: Audit worldwide recipe research gaps
on:
  workflow_dispatch:
  push:
    branches:
      - feat/recipe-kitchen-foundation
    paths:
      - scripts/build-research-report.mjs

permissions:
  contents: write

jobs:
  audit-gaps:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build country-by-category review queue from source-only data
        run: node scripts/build-research-report.mjs
      - name: Save audit report on development branch only
        if: success() && github.ref == 'refs/heads/feat/recipe-kitchen-foundation'
        run: |
          cp artifacts/world-research-gaps.json data/world-research-gaps.json
          cp artifacts/world-research-gaps.csv data/world-research-gaps.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world-research-gaps.json data/world-research-gaps.csv
          if ! git diff --cached --quiet; then
            git commit -m "data: add unreviewed country-category research lead audit"
            git push origin HEAD:refs/heads/feat/recipe-kitchen-foundation
          fi
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tasteit-source-tag-research-gap-audit
          path: artifacts/world-research-gaps.*
          if-no-files-found: warn
          retention-days: 30
